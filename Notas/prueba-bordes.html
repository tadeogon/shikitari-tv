<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ziota bordes</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--fondo:#0b1030;--vidrio:#272c57;--linea:#454b7c;--acento:#4fb3ff}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:#fff;font-family:Montserrat,sans-serif;min-height:100vh;padding:40px 56px}
h1{font-weight:500;font-size:15px;letter-spacing:4px;color:#9aa0c8;margin:28px 0 18px}
.efectos{display:flex;gap:10px;flex-wrap:wrap}
.efectos button{font:inherit;font-size:14px;color:#c9cbe0;background:#1a1f45;border:1px solid var(--linea);border-radius:20px;padding:8px 16px;cursor:pointer}
.efectos button.on{background:#fff;color:#0b1030;border-color:#fff}
.ayuda{color:#7f86b5;font-size:13px;margin-top:10px}
.fila{display:flex;gap:28px;padding:20px 4px 10px;flex-wrap:wrap}
.t{width:250px;aspect-ratio:16/9;border-radius:16px;background:var(--vidrio);border:1px solid var(--linea);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;outline:none;cursor:pointer;transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s;isolation:isolate}
.t img.logo{max-width:62%;max-height:36%;object-fit:contain}
.t .sim{width:44px;height:44px}
.t .nom{font-size:15px;font-weight:500}
.t::after{content:"";position:absolute;top:10px;right:11px;width:9px;height:9px;border-radius:50%;background:var(--acento);opacity:0;transition:opacity .2s}
.t:focus{transform:scale(1.1);z-index:2}
.t:focus::after{opacity:1}
.debajo{text-align:center;font-size:14px;color:#dfe1f2;margin-top:12px;opacity:0;transition:opacity .2s}
.celda:focus-within .debajo{opacity:1}
/* 1 actual */
.e1 .t:focus{border:3px solid #fff}
/* 2 brillo que recorre el borde */
.e2 .t:focus{border-color:transparent}
.e2 .t:focus::before{content:"";position:absolute;inset:-3px;border-radius:18px;padding:3px;background:conic-gradient(from var(--a),#fff 0deg,#fff 250deg,rgba(255,255,255,.25) 300deg,#fff 360deg);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:gira 2.4s linear infinite;z-index:-1}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes gira{to{--a:360deg}}
/* 3 halo suave blanco */
.e3 .t:focus{border:2px solid #fff;box-shadow:0 0 0 6px rgba(255,255,255,.10),0 18px 40px rgba(0,0,0,.55)}
/* 4 doble borde con aire */
.e4 .t:focus{border-color:transparent;box-shadow:0 0 0 4px var(--fondo),0 0 0 7px #fff}
/* 5 reflejo de vidrio que cruza */
.e5 .t{overflow:hidden}
.e5 .t:focus{border:3px solid #fff}
.e5 .t:focus::before{content:"";position:absolute;top:-20%;bottom:-20%;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.22),transparent);transform:skewX(-18deg);animation:cruza .9s ease-out .05s 1 both;z-index:-1}
@keyframes cruza{to{left:130%}}
/* 6 se levanta: borde blanco + sombra larga, logo crece */
.e6 .t:focus{border:3px solid #fff;transform:scale(1.1) translateY(-6px);box-shadow:0 26px 50px rgba(0,0,0,.6)}
.e6 .t:focus img.logo,.e6 .t:focus .sim{transform:scale(1.06);transition:transform .25s}
@media (prefers-reduced-motion:reduce){.t,.t::before{animation:none!important;transition:none}}
</style></head>

<div class="efectos" id="efectos"></div>

const efectos=['Actual','Brillo que gira','Halo suave','Doble borde','Reflejo de vidrio','Se levanta'];
const fila=document.getElementById('fila');
apps.forEach(a=>{const c=document.createElement('div');c.className='celda';
 c.innerHTML=`<div class="t" tabindex="0">${a.img?`<img class="logo" src="${a.img}" alt="${a.n}">`:a.svg+`<span class="nom">${a.n}</span>`}</div><div class="debajo">${a.img?a.n:''}</div>`;fila.appendChild(c)});
const tiles=[...document.querySelectorAll('.t')];
const be=document.getElementById('efectos');
function poner(i){document.body.className='e'+(i+1);[...be.children].forEach((b,j)=>b.classList.toggle('on',i==j));
 const f=document.activeElement;if(f&&f.classList.contains('t')){f.blur();f.focus()}}
efectos.forEach((e,i)=>{const b=document.createElement('button');b.textContent=(i+1)+' · '+e;b.tabIndex=-1;b.onclick=()=>poner(i);be.appendChild(b)});
document.addEventListener('keydown',ev=>{
 if(ev.key>='1'&&ev.key<='6'){poner(+ev.key-1);return}
 const i=tiles.indexOf(document.activeElement);
 if(ev.key=='ArrowRight'){tiles[Math.min(i+1,tiles.length-1)].focus();ev.preventDefault()}
 if(ev.key=='ArrowLeft'){tiles[Math.max(i-1,0)].focus();ev.preventDefault()}});
poner(0);tiles[0].focus();
</script></body></html>
