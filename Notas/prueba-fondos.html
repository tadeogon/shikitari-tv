<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ziota fondos</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--acento:#8b5cff;--brillo:rgba(139,92,255,.55)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#05060d;color:#fff;font-family:Montserrat,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
.tv{width:min(100vw,1280px);aspect-ratio:16/9;position:relative;overflow:hidden;border-radius:6px;background:#07070f}
.fondo{position:absolute;inset:0;transition:opacity .6s}
.fondo svg{width:100%;height:100%;display:block}
.capa{position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,5,12,.85) 0%,rgba(5,5,12,.35) 45%,rgba(5,5,12,0) 70%),linear-gradient(0deg,rgba(5,5,12,.7) 0%,rgba(5,5,12,0) 45%)}
.ui{position:absolute;inset:0;padding:4.5% 4% 0 13%;font-size:clamp(9px,1.25vw,16px)}
.riel{position:absolute;left:0;top:0;bottom:0;width:9%;background:rgba(10,10,22,.45);border-right:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2em;font-size:.7em;color:#b9bbd0}
.riel div{display:flex;flex-direction:column;align-items:center;gap:.4em}
.riel .on{background:color-mix(in srgb,var(--acento) 35%,transparent);border:1px solid var(--acento);border-radius:12px;padding:.8em 1em;color:#fff;box-shadow:0 0 18px var(--brillo)}
.riel svg{width:1.8em;height:1.8em}
.hora{font-size:4.2em;font-weight:500;line-height:1;letter-spacing:-.02em}
.fecha{color:#cfd1e4;margin-top:.3em}
.clima{position:absolute;right:4%;top:5%;display:flex;align-items:center;gap:.6em;font-size:1.3em}
.sec{display:flex;align-items:center;gap:.6em;font-weight:500;margin:2.4em 0 1em}
.sec::before{content:"";width:3px;height:1.1em;background:var(--acento);border-radius:2px}
.fila{display:flex;gap:1.4em}
.fondo img{width:100%;height:100%;object-fit:cover;display:block}
.t{width:8.2em;height:7.4em;border-radius:1.1em;background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.03) 45%,rgba(0,0,0,.25));border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.28);backdrop-filter:blur(18px) saturate(1.4);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.7em;font-size:.95em;outline:none;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s;position:relative}
.t .ic{width:3em;height:3em;display:flex;align-items:center;justify-content:center;transition:transform .25s}
.t .ic svg{width:100%;height:100%}
.t:focus{transform:scale(1.12) translateY(-.4em);border:2px solid #fff;box-shadow:0 0 0 1px var(--acento),0 0 22px var(--brillo),0 1.6em 2.6em rgba(0,0,0,.6);z-index:2}
.t:focus .ic{transform:scale(1.06)}
.r{width:11em;height:6.2em;border-radius:.9em;outline:none;border:1px solid rgba(255,255,255,.1);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.r:focus{transform:scale(1.1) translateY(-.3em);border:2px solid #fff;box-shadow:0 0 0 1px var(--acento),0 0 22px var(--brillo),0 1.4em 2.4em rgba(0,0,0,.6)}
.barra{position:fixed;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;z-index:9}
.barra button{font:inherit;font-size:13px;color:#ddd;background:#1a1b2c;border:1px solid #3a3c58;border-radius:20px;padding:6px 14px;cursor:pointer}
.barra button.on{background:#fff;color:#111}
@media (prefers-reduced-motion:reduce){.t,.r,.fondo{transition:none}}
</style></head>
